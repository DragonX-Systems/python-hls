[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python_hls"
version = "0.1.0"
description = "High-Level Synthesis tool that compiles Python to hardware netlists. Built for trading firms."
readme = "README.md"
license = {text = "PolyForm Noncommercial 1.0.0"}
requires-python = ">=3.9"
authors = [{name = "Python-HLS Contributors"}]
keywords = ["hls", "hardware", "synthesis", "fpga", "verilog", "vhdl", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "astroid>=2.15.0",
    "networkx>=3.1",
    "graphviz>=0.20.1",
    "pyverilog>=1.3.0",
    "matplotlib>=3.7.1",
    "click>=8.1.3",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
verification = []  # Verilator is system dependency, not pip-installable
ml = ["torch>=2.0"]
jax = ["jax>=0.4.0", "jaxlib>=0.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["python_hls*"]
