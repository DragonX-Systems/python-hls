name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (graphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run tests
        run: |
          pytest tests/test_constraints.py \
                 tests/test_smoke_e2e.py \
                 tests/test_cli_integration.py \
                 tests/test_hls.py \
                 tests/test_gcd.py \
                 tests/test_trading_demos.py \
                 tests/test_ir_generator.py \
                 tests/test_scheduler.py \
                 tests/test_bfs_bulk_hls.py \
                 tests/test_fft_hls.py \
                 tests/test_spmm_hls.py \
                 tests/test_tech_nodes.py \
                 -v --tb=short --timeout=120
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Run RTL verification tests
        run: pytest tests/test_rtl_verification.py -v --tb=short --timeout=120
        env:
          PYTHONPATH: ${{ github.workspace }}
