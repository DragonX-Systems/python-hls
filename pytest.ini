[pytest]
# Core tests for CI - constraint system, smoke, CLI, HLS integration
# Run with: pytest tests/ -v
# Or quick smoke: pytest tests/test_smoke_e2e.py tests/test_constraints.py -v
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
