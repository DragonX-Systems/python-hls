<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
    <style>
        .class-box {
            fill: #f5f5f5;
            stroke: #333;
            stroke-width: 2;
        }
        .class-name {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
        }
        .class-attrs {
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-anchor: start;
        }
        .class-methods {
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-anchor: start;
        }
        .divider {
            stroke: #333;
            stroke-width: 1;
        }
        .arrow {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .dashed-arrow {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 5, 5;
            marker-end: url(#arrowhead);
        }
        .label {
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-anchor: middle;
            fill: #333;
        }
    </style>
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
        </marker>
    </defs>
    
    <!-- Main HLS Class -->
    <rect x="500" y="50" width="200" height="200" class="class-box" rx="5" ry="5"/>
    <text x="600" y="75" class="class-name">HLS</text>
    <line x1="500" y1="85" x2="700" y2="85" class="divider"/>
    <text x="510" y="105" class="class-attrs">- optimization_level: int</text>
    <text x="510" y="120" class="class-attrs">- tech_node: int</text>
    <text x="510" y="135" class="class-attrs">- tech_library: TechLibrary</text>
    <text x="510" y="150" class="class-attrs">- parser: PythonParser</text>
    <text x="510" y="165" class="class-attrs">- ir_generator: IRGenerator</text>
    <text x="510" y="180" class="class-attrs">- optimizer: Optimizer</text>
    <line x1="500" y1="190" x2="700" y2="190" class="divider"/>
    <text x="510" y="210" class="class-methods">+ compile(source_file, target, output_file)</text>
    <text x="510" y="225" class="class-methods">+ visualize_datapath(output_file)</text>
    <text x="510" y="240" class="class-methods">+ get_performance_metrics()</text>
    
    <!-- IR Components -->
    <!-- IR Class -->
    <rect x="150" y="50" width="180" height="120" class="class-box" rx="5" ry="5"/>
    <text x="240" y="75" class="class-name">IR</text>
    <line x1="150" y1="85" x2="330" y2="85" class="divider"/>
    <text x="160" y="105" class="class-attrs">- functions: Dict[str, IRFunction]</text>
    <text x="160" y="120" class="class-attrs">- global_vars: Dict[str, IRVariable]</text>
    <line x1="150" y1="130" x2="330" y2="130" class="divider"/>
    <text x="160" y="150" class="class-methods">+ get_main_function()</text>
    <text x="160" y="165" class="class-methods">+ add_function(func)</text>
    
    <!-- IRFunction Class -->
    <rect x="150" y="200" width="180" height="120" class="class-box" rx="5" ry="5"/>
    <text x="240" y="225" class="class-name">IRFunction</text>
    <line x1="150" y1="235" x2="330" y2="235" class="divider"/>
    <text x="160" y="255" class="class-attrs">- parameters: List[IRVariable]</text>
    <text x="160" y="270" class="class-attrs">- blocks: List[IRBlock]</text>
    <text x="160" y="285" class="class-attrs">- local_vars: Dict[str, IRVariable]</text>
    <line x1="150" y1="295" x2="330" y2="295" class="divider"/>
    <text x="160" y="315" class="class-methods">+ latency_ns()</text>
    
    <!-- IRBlock Class -->
    <rect x="150" y="350" width="180" height="120" class="class-box" rx="5" ry="5"/>
    <text x="240" y="375" class="class-name">IRBlock</text>
    <line x1="150" y1="385" x2="330" y2="385" class="divider"/>
    <text x="160" y="405" class="class-attrs">- instructions: List[IRInstruction]</text>
    <text x="160" y="420" class="class-attrs">- predecessors: List[IRBlock]</text>
    <text x="160" y="435" class="class-attrs">- successors: List[IRBlock]</text>
    <line x1="150" y1="445" x2="330" y2="445" class="divider"/>
    
    <!-- IROperation Class -->
    <rect x="150" y="500" width="180" height="120" class="class-box" rx="5" ry="5"/>
    <text x="240" y="525" class="class-name">IROperation</text>
    <line x1="150" y1="535" x2="330" y2="535" class="divider"/>
    <text x="160" y="555" class="class-attrs">- op_type: OperationType</text>
    <text x="160" y="570" class="class-attrs">- operands: List</text>
    <text x="160" y="585" class="class-attrs">- result: IRVariable</text>
    <text x="160" y="600" class="class-attrs">- control_step: int</text>
    <line x1="150" y1="610" x2="330" y2="610" class="divider"/>
    
    <!-- IRGenerator Class -->
    <rect x="380" y="350" width="180" height="100" class="class-box" rx="5" ry="5"/>
    <text x="470" y="375" class="class-name">IRGenerator</text>
    <line x1="380" y1="385" x2="560" y2="385" class="divider"/>
    <line x1="380" y1="395" x2="560" y2="395" class="divider"/>
    <text x="390" y="415" class="class-methods">+ generate(ast)</text>
    
    <!-- Technology Components -->
    <!-- TechLibrary Class -->
    <rect x="800" y="50" width="180" height="140" class="class-box" rx="5" ry="5"/>
    <text x="890" y="75" class="class-name">TechLibrary</text>
    <line x1="800" y1="85" x2="980" y2="85" class="divider"/>
    <text x="810" y="105" class="class-attrs">- tech_node: int</text>
    <text x="810" y="120" class="class-attrs">- resources: Dict</text>
    <line x1="800" y1="130" x2="980" y2="130" class="divider"/>
    <text x="810" y="150" class="class-methods">+ add_resource(resource)</text>
    <text x="810" y="165" class="class-methods">+ get_resource(name, tech_node)</text>
    <text x="810" y="180" class="class-methods">+ set_tech_node(tech_node)</text>
    
    <!-- ResourceModel Class -->
    <rect x="800" y="220" width="180" height="160" class="class-box" rx="5" ry="5"/>
    <text x="890" y="245" class="class-name">ResourceModel</text>
    <line x1="800" y1="255" x2="980" y2="255" class="divider"/>
    <text x="810" y="275" class="class-attrs">- name: str</text>
    <text x="810" y="290" class="class-attrs">- area: float</text>
    <text x="810" y="305" class="class-attrs">- latency: int</text>
    <text x="810" y="320" class="class-attrs">- energy_per_op: float</text>
    <text x="810" y="335" class="class-attrs">- tech_node: int</text>
    <text x="810" y="350" class="class-attrs">- frequency: float</text>
    <line x1="800" y1="360" x2="980" y2="360" class="divider"/>
    <text x="810" y="375" class="class-methods">+ scale_to_node(new_node)</text>
    
    <!-- Scheduler Components -->
    <!-- Scheduler (abstract) Class -->
    <rect x="600" y="350" width="180" height="120" class="class-box" rx="5" ry="5"/>
    <text x="690" y="375" class="class-name">Scheduler</text>
    <line x1="600" y1="385" x2="780" y2="385" class="divider"/>
    <text x="610" y="405" class="class-attrs">- tech_library: TechLibrary</text>
    <line x1="600" y1="415" x2="780" y2="415" class="divider"/>
    <text x="610" y="435" class="class-methods">+ schedule(ir): IR</text>
    <text x="610" y="450" class="class-methods"># _build_dfg(func)</text>
    <text x="610" y="465" class="class-methods"># _get_operation_delay(op)</text>
    
    <!-- ASAPScheduler Class -->
    <rect x="500" y="500" width="180" height="80" class="class-box" rx="5" ry="5"/>
    <text x="590" y="525" class="class-name">ASAPScheduler</text>
    <line x1="500" y1="535" x2="680" y2="535" class="divider"/>
    <line x1="500" y1="545" x2="680" y2="545" class="divider"/>
    <text x="510" y="565" class="class-methods">+ schedule(ir): IR</text>
    
    <!-- ALAPScheduler Class -->
    <rect x="700" y="500" width="180" height="80" class="class-box" rx="5" ry="5"/>
    <text x="790" y="525" class="class-name">ALAPScheduler</text>
    <line x1="700" y1="535" x2="880" y2="535" class="divider"/>
    <line x1="700" y1="545" x2="880" y2="545" class="divider"/>
    <text x="710" y="565" class="class-methods">+ schedule(ir, latency_constraint): IR</text>
    
    <!-- Backend Components -->
    <!-- Netlist Class -->
    <rect x="800" y="600" width="180" height="120" class="class-box" rx="5" ry="5"/>
    <text x="890" y="625" class="class-name">Netlist</text>
    <line x1="800" y1="635" x2="980" y2="635" class="divider"/>
    <text x="810" y="655" class="class-attrs">- modules: Dict</text>
    <text x="810" y="670" class="class-attrs">- total_area: float</text>
    <text x="810" y="685" class="class-attrs">- total_power: float</text>
    <line x1="800" y1="695" x2="980" y2="695" class="divider"/>
    <text x="810" y="715" class="class-methods">+ get_resource_report()</text>
    
    <!-- VerilogGenerator Class -->
    <rect x="600" y="600" width="180" height="80" class="class-box" rx="5" ry="5"/>
    <text x="690" y="625" class="class-name">VerilogGenerator</text>
    <line x1="600" y1="635" x2="780" y2="635" class="divider"/>
    <line x1="600" y1="645" x2="780" y2="645" class="divider"/>
    <text x="610" y="665" class="class-methods">+ generate(ir): Netlist</text>
    
    <!-- Connections -->
    <!-- HLS to components -->
    <path d="M 500 125 L 330 125" class="arrow"/>
    <path d="M 700 125 L 800 125" class="arrow"/>
    <path d="M 600 250 L 470 350" class="arrow"/>
    <path d="M 600 250 L 690 350" class="arrow"/>
    
    <!-- IR hierarchy -->
    <path d="M 240 170 L 240 200" class="arrow"/>
    <path d="M 240 320 L 240 350" class="arrow"/>
    <path d="M 240 470 L 240 500" class="arrow"/>
    
    <!-- Scheduler hierarchy -->
    <path d="M 690 470 L 590 500" class="arrow"/>
    <path d="M 690 470 L 790 500" class="arrow"/>
    
    <!-- Tech relationship -->
    <path d="M 890 190 L 890 220" class="arrow"/>
    
    <!-- Backend connections -->
    <path d="M 690 680 L 800 680" class="arrow"/>
    
    <!-- Labels -->
    <text x="400" y="115" class="label">uses</text>
    <text x="760" y="115" class="label">uses</text>
    <text x="540" y="300" class="label">creates</text>
    <text x="650" y="300" class="label">uses</text>
    <text x="240" y="185" class="label">contains</text>
    <text x="240" y="335" class="label">contains</text>
    <text x="240" y="485" class="label">contains</text>
    <text x="620" y="485" class="label">extends</text>
    <text x="760" y="485" class="label">extends</text>
    <text x="890" y="205" class="label">contains</text>
    <text x="740" y="670" class="label">creates</text>
</svg> 